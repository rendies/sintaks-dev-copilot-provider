name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npx @vscode/vsce package --out /tmp/ext.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: /tmp/ext.vsix
