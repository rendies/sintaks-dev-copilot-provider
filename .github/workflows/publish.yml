# Do not rename this file — the Marketplace Trusted Publishing policy
# is bound to the workflow filename "publish.yml".
#
# One-time setup on https://marketplace.visualstudio.com/manage:
#   publisher sintaks-dev → Trusted Publishing → Create:
#     Repository owner: rendies
#     Repository:       sintaks-dev-copilot-provider
#     Workflow:         publish.yml
#     Environment:      marketplace
# Also create the GitHub environment "marketplace" (Settings →
# Environments) — optionally with Required reviewers.
#
# Release: git tag v0.1.0 && git push origin v0.1.0
name: publish

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: marketplace
      url: https://marketplace.visualstudio.com/items?itemName=sintaks-dev.sintaks-dev-copilot-provider
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          [ "$tag" = "$pkg" ] || { echo "tag v$tag != package.json $pkg"; exit 1; }

      - run: npm ci
      - run: npm run typecheck

      - name: Publish to Visual Studio Marketplace
        run: npx @vscode/vsce publish --oidc --no-update-package-json
